name: "Label Issues"
on:
  issues:
    types: [opened, edited]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: github/issue-labeler@v2.0
        with:
          configuration-path: .github/config/labels.yml
          repo-token: ${{ secrets.GITHUB_TOKEN }}
